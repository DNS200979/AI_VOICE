services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: voxisp
      POSTGRES_PASSWORD: voxisp
      POSTGRES_DB: voxisp
    ports:
      - "5432:5432"
    volumes:
      - voxisp_pg_data:/var/lib/postgresql/data
      - ./src/voxisp/db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U voxisp"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  voxisp_pg_data:
