[project]
name = "voxisp"
version = "0.1.0"
description = "VOX-ISP — Atendente Virtual de Voz para Provedores de Internet (ISPs)"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
authors = [{ name = "DNS-TI Consultoria" }]
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "redis>=5.0",
    "python-dotenv>=1.0",
    "structlog>=24.1",
    "anthropic>=0.70",
    "httpx>=0.27",
    "alembic>=1.13",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.6",
    "mypy>=1.11",
    "aiosqlite>=0.20",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
# Boilerplate gerado por `alembic revision --autogenerate` (script.py.mako
# do próprio Alembic) — cada nova revisão reintroduziria o mesmo estilo
# (Union[...] em vez de X | Y etc.), então exclui em vez de corrigir a
# cada `alembic revision` futura. env.py (mantido à mão) continua lintado.
extend-exclude = ["src/voxisp/db/migrations/versions"]
